[project]
name = "shiftguard"
version = "0.1.0"
description = "Buffer-aware shift conflict alerts and review-only manager drafts"
readme = "README.md"
authors = [
    { name = "fouadbuilds" }
]
requires-python = ">=3.11"
dependencies = [
    "groq>=1.7.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
shiftguard = "shiftguard:main"
shiftguard-telegram-setup = "shiftguard.telegram_setup:main"
shiftguard-send-demo-alert = "shiftguard.telegram_notify:main"
shiftguard-draft-demo-message = "shiftguard.draft_demo:main"
shiftguard-send-demo-draft = "shiftguard.telegram_draft:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
